<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gordelicias da Lari | Carrinho</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../assets/css/variaveis.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/cliente.css">
</head>
<body>

  <header class="topo">
    <div class="container topo__conteudo">
      <a href="index.html" class="topo__logo">
        <img src="../assets/img/logo/logo.png" alt="Gordelicias da Lari - confeitaria artesanal">
      </a>

      <nav class="topo__acoes">
        <a href="index.html" class="botao botao--contorno">
          <i class="bi bi-arrow-left"></i>
          <span class="botao__texto">Continuar comprando</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container secao-carrinho">
    <h1>Seu carrinho</h1>

    <div id="avisos-carrinho" class="aviso-carrinho" role="status" hidden></div>

    <div id="carrinho-vazio" class="carrinho-vazio" hidden>
      <i class="bi bi-cart-x"></i>
      <p>Seu carrinho está vazio.</p>
      <a href="index.html" class="botao">Ver cardápio</a>
    </div>

    <div id="carrinho-conteudo" class="carrinho-layout" hidden>
      <section id="lista-itens" class="lista-itens" aria-label="Itens do carrinho"></section>

      <aside class="resumo">
        <h2>Resumo do pedido</h2>
      <div class="resumo__linha">
        <span>Itens</span>
        <span id="resumo-quantidade"></span>
      </div>

      <div class="resumo__linha resumo__linha--total">
        <span>Total</span>
        <span id="resumo-total"></span>
      </div>
        <a id="btn-finalizar" href="finalizar-pedido.html" class="botao">Finalizar pedido</a>
        <p id="aviso-loja" class="nota" hidden></p>
        <button id="btn-limpar" type="button" class="botao botao--contorno">Esvaziar carrinho</button>

      </aside>

      <p class="nota">A taxa de entrega é calculada na finalização, de acordo com o seu bairro.</p>
      
    </div>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>Gordelícias da Lari · Confeitaria artesanal</p>
    </div>
  </footer>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/cliente/carrinho.js"></script>
  <script src="../assets/js/cliente/carrinho.js"></script>
</body>
</html>
