<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gordelicias da Lari | Pedido enviado</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../assets/css/variaveis.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/cliente.css">
</head>
<body>

  <header class="topo">
    <div class="container topo__conteudo">
      <a href="index.html" class="topo__logo">
        <img src="../assets/img/logo/logo.png" alt="Gordelicias da Lari - confeitaria artesanal">
      </a>
    </div>
  </header>

  <main class="container">
    <section class="confirmacao">
      <i class="bi bi-check-circle-fill"></i>
      <h1>Pedido enviado!</h1>
      <p id="mensagem"></p>

      <div class="confirmacao__dados">
        <span id="dado-total"></span>
        <span id="dado-pagamento"></span>
        <span id="dado-previsao"></span>
      </div>

      <a id="btn-whatsapp" class="botao botao--secundario" target="_blank" rel="noopener">
        <i class="bi bi-whatsapp"></i> Falar com a loja
      </a>
      <a id="btn-acompanhar" class="botao">Acompanhar pedido</a>
      <a href="index.html" class="botao botao--contorno">Voltar ao cardápio</a>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>Gordelicias da Lari · Confeitaria artesanal</p>
    </div>
  </footer>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script>
    const pedido = JSON.parse(sessionStorage.getItem("ultimoPedido") || "null");

    if (!pedido) {
      // Quem chegar aqui sem ter feito um pedido volta para o cardápio
      window.location.replace("index.html");
    } else {
      const formas = {
        pix: "Pix",
        debito: "Cartão de débito",
        credito: "Cartão de crédito",
        dinheiro: "Dinheiro"
      };

      document.getElementById("mensagem").textContent =
        `${pedido.nome}, recebemos o seu pedido nº ${pedido.numero}.`;
      document.getElementById("dado-total").textContent = `Total: ${formatarPreco(pedido.total)}`;
      document.getElementById("dado-pagamento").textContent =
        `Pagamento: ${formas[pedido.pagamento] || pedido.pagamento}`;
      document.getElementById("dado-previsao").textContent =
        pedido.previsao ? `Previsão de entrega: ${pedido.previsao}` : "";

      const texto = encodeURIComponent(`Olá! Fiz o pedido nº ${pedido.numero} pelo cardápio virtual.`);
      document.getElementById("btn-whatsapp").href =
        `https://wa.me/${CONFIG.loja.whatsapp}?text=${texto}`;

      document.getElementById("btn-acompanhar").href = `acompanhar.html?numero=${pedido.numero}`;
    }
  </script>
</body>
</html>
