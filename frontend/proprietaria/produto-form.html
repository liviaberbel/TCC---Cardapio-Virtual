<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gordelicias da Lari | Cadastrar produto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../assets/css/variaveis.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/proprietaria.css">
</head>
<body class="layout-interno" data-pagina="produtos">

  <aside id="menu-lateral" class="menu-lateral"></aside>

  <main class="conteudo-interno">
    <div class="cabecalho-pagina">
      <div>
        <h1 id="titulo-pagina" class="titulo-pagina">Cadastrar produto</h1>
        <p class="subtitulo-pagina">Preencha os dados do doce. A foto aparece no cardápio do cliente.</p>
      </div>
      <a href="produtos.html" class="botao botao--contorno"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>

    <div id="erro-form" class="mensagem-erro" role="alert" hidden></div>

    <form id="form-produto" class="form-produto">

      <section class="bloco-interno">
        <h2>Dados do produto</h2>
        <div class="campos">
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" maxlength="80" required>
          </div>

          <div class="campo">
            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" list="lista-categorias" maxlength="60"
                   placeholder="Escolha ou digite uma nova" required>
            <datalist id="lista-categorias"></datalist>
          </div>

          <div class="campo">
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" name="preco" min="0.01" step="0.01" placeholder="0,00" required>
          </div>

          <div class="campo">
            <label for="quantidade">Quantidade disponível hoje</label>
            <input type="number" id="quantidade" name="quantidade" min="0" step="1" placeholder="0" required>
          </div>

          <div class="campo campo--larga">
            <label for="descricao">Descrição (opcional)</label>
            <textarea id="descricao" name="descricao" rows="3" maxlength="200"></textarea>
          </div>
        </div>
      </section>

      <section class="bloco-interno">
        <h2>Foto do produto</h2>

        <div id="foto-preview" class="foto-preview"></div>

        <input type="file" id="foto" name="foto" accept="image/jpeg,image/png,image/webp" class="input-arquivo">
        <label for="foto" class="botao botao--secundario botao-arquivo">
          <i class="bi bi-upload"></i> Escolher foto
        </label>

        <p class="nota">JPG, PNG ou WebP, até 5 MB. Prefira fotos na proporção 4:3 (como 800 × 600 px).</p>
      </section>

      <div class="acoes-form">
        <button type="submit" id="btn-salvar" class="botao">Salvar produto</button>
        <a href="produtos.html" class="botao botao--contorno">Cancelar</a>
      </div>

    </form>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/proprietaria/auth.js"></script>
  <script src="../assets/js/proprietaria/menu.js"></script>
  <script src="../assets/js/proprietaria/produto-form.js"></script>
</body>
</html>
