<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gordelicias da Lari | Produtos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../assets/css/variaveis.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/proprietaria.css">
</head>
<body class="layout-interno" data-pagina="produtos">

  <aside id="menu-lateral" class="menu-lateral"></aside>

  <main class="conteudo-interno">
    <div class="cabecalho-pagina">
      <div>
        <h1 class="titulo-pagina">Produtos</h1>
        <p class="subtitulo-pagina">
          Atualize a quantidade disponível do dia. Com quantidade zero, o produto aparece como esgotado no cardápio.
        </p>
      </div>
      <a href="produto-form.html" class="botao"><i class="bi bi-plus-lg"></i> Cadastrar produto</a>
    </div>

    <div id="aviso-produtos" class="aviso" role="status" hidden></div>
    <div id="erro-produtos" class="mensagem-erro" role="alert" hidden></div>

    <section class="bloco-interno">
        <div class="busca busca--tabela">
            <i class="bi bi-search"></i>
            <input type="search" id="busca-produtos" placeholder="Buscar por nome, categoria ou descrição..." aria-label="Buscar produtos">
        </div>
        
      <div class="tabela-rolagem">
        <table class="tabela">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Produto</th>
              <th>Preço</th>
              <th>Quantidade do dia</th>
              <th>Situação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos"></tbody>
        </table>
      </div>
      <p id="sem-produtos" class="nota" hidden>Nenhum produto cadastrado ainda.</p>
    </section>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/proprietaria/auth.js"></script>
  <script src="../assets/js/proprietaria/menu.js"></script>
  <script src="../assets/js/proprietaria/produtos.js"></script>
</body>
</html>
