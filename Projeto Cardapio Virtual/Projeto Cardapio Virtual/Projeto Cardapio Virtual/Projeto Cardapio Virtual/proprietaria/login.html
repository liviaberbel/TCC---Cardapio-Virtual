<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gordelicias da Lari | Área da proprietária</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../assets/css/variaveis.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/proprietaria.css">
</head>
<body class="pagina-login">

  <main class="login">
    <img class="login__logo" src="../assets/img/logo/logo.png" alt="Gordelicias da Lari - confeitaria artesanal">
    <h1>Área da proprietária</h1>

    <form id="form-login">
      <div id="erro-login" class="mensagem-erro" role="alert" hidden></div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
          <button type="button" id="btn-ver-senha" aria-label="Mostrar senha">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-entrar" class="botao">Entrar</button>
    </form>

    <a href="../cliente/index.html" class="login__voltar">Voltar ao cardápio</a>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/proprietaria/auth.js"></script>
</body>
</html>
